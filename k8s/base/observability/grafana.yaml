---
# Default admin credentials — change after first login or patch the Secret before deploying
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  admin-user: admin
  admin-password: petclinic-admin
---
# Datasources with PINNED UIDs — uid: prometheus and uid: loki are mandatory.
# Without pinned UIDs, Grafana 10+ auto-generates random UIDs on each restart and
# every dashboard panel shows "No Data" because the JSON hardcodes the expected UID.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090
        access: proxy
        isDefault: true
        editable: false
        jsonData:
          timeInterval: "15s"
      - name: Loki
        type: loki
        uid: loki
        url: http://loki:3100
        access: proxy
        isDefault: false
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: petclinic
        folder: Petclinic
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/petclinic
---
# All dashboard panel targets include "datasource": {"type": "prometheus", "uid": "prometheus"}
# and "refId": "A" (B, C... for multiple targets in same panel).
# Grafana 10+ requires both fields — missing either causes "Failed to upgrade legacy queries".
