# Helm values for prometheus-community/kube-prometheus-stack
# Installs: Prometheus, Grafana, Alertmanager, kube-state-metrics, node-exporter
#
# Placeholders substituted by scripts/install-observability.sh:
#   PETCLINIC_NAMESPACE  — e.g., petclinic-dev or petclinic-prod
#   PROMETHEUS_STORAGE_SIZE — e.g., 10Gi (dev) or 50Gi (prod)
#   PROMETHEUS_RETENTION    — e.g., 7d (dev) or 15d (prod)
#   ALERT_EMAIL             — alert destination email, or empty string
#   SMTP_HOST               — SMTP smarthost, e.g., smtp.gmail.com:587
#   SMTP_FROM               — sender address
#   SMTP_USERNAME           — SMTP auth username
#   SMTP_PASSWORD           — SMTP auth password (from env, not committed)

prometheus:
  prometheusSpec:
    retention: PROMETHEUS_RETENTION
    evaluationInterval: 15s
    scrapeInterval: 15s
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: PROMETHEUS_STORAGE_SIZE
    additionalScrapeConfigs:
      - job_name: config-server
        metrics_path: /actuator/prometheus
        scrape_interval: 15s
        static_configs:
          - targets:
              - config-server.PETCLINIC_NAMESPACE.svc.cluster.local:8888
      - job_name: discovery-server
        metrics_path: /actuator/prometheus
        scrape_interval: 15s
        static_configs:
          - targets:
              - discovery-server.PETCLINIC_NAMESPACE.svc.cluster.local:8761
      - job_name: api-gateway
        metrics_path: /actuator/prometheus
        scrape_interval: 15s
        static_configs:
          - targets:
              - api-gateway.PETCLINIC_NAMESPACE.svc.cluster.local:8080
      - job_name: customers-service
        metrics_path: /actuator/prometheus
        scrape_interval: 15s
        static_configs:
          - targets:
              - customers-service.PETCLINIC_NAMESPACE.svc.cluster.local:8081
      - job_name: visits-service
        metrics_path: /actuator/prometheus
        scrape_interval: 15s
        static_configs:
          - targets:
              - visits-service.PETCLINIC_NAMESPACE.svc.cluster.local:8082
      - job_name: vets-service
        metrics_path: /actuator/prometheus
        scrape_interval: 15s
        static_configs:
          - targets:
              - vets-service.PETCLINIC_NAMESPACE.svc.cluster.local:8083
      - job_name: genai-service
        metrics_path: /actuator/prometheus
        scrape_interval: 15s
        static_configs:
          - targets:
              - genai-service.PETCLINIC_NAMESPACE.svc.cluster.local:8084
      - job_name: admin-server
        metrics_path: /actuator/prometheus
        scrape_interval: 15s
        static_configs:
          - targets:
              - admin-server.PETCLINIC_NAMESPACE.svc.cluster.local:9090

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: "SMTP_HOST"
      smtp_from: "SMTP_FROM"
      smtp_auth_username: "SMTP_USERNAME"
      smtp_auth_password: "SMTP_PASSWORD"
      smtp_require_tls: false
    route:
      receiver: default
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - severity=critical
          receiver: email-critical
          group_wait: 0s
        - matchers:
            - severity=warning
          receiver: email-warning
    receivers:
      - name: default
      - name: email-critical
        email_configs:
          - to: "ALERT_EMAIL"
            send_resolved: true
            headers:
              Subject: "[CRITICAL] Petclinic alert: {{ .GroupLabels.alertname }}"
      - name: email-warning
        email_configs:
          - to: "ALERT_EMAIL"
            send_resolved: true
            headers:
              Subject: "[WARNING] Petclinic alert: {{ .GroupLabels.alertname }}"
    inhibit_rules:
      - source_matchers:
          - severity=critical
        target_matchers:
          - severity=warning
        equal: [alertname, namespace, pod]

additionalPrometheusRulesMap:
  petclinic-rules:
    groups:
      - name: petclinic.availability
        rules:
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.job }} is down"
              description: "Prometheus target {{ $labels.job }} ({{ $labels.instance }}) has been unreachable for >1 minute."
          - alert: PodRestartLoop
            expr: increase(kube_pod_container_status_restarts_total{namespace=~"petclinic-.*"}[15m]) > 3
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} is restart-looping"
              description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has restarted {{ $value | printf \"%.0f\" }} times in the last 15 minutes."
      - name: petclinic.performance
        rules:
          - alert: HighErrorRate
            expr: |
              rate(http_server_requests_seconds_count{status=~"5..",namespace=~"petclinic-.*"}[5m])
              /
              rate(http_server_requests_seconds_count{namespace=~"petclinic-.*"}[5m])
              > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High 5xx error rate on {{ $labels.job }}"
              description: "{{ $labels.job }} is returning {{ $value | humanizePercentage }} 5xx errors over the last 5 minutes."
          - alert: HighLatency
            expr: |
              histogram_quantile(0.95,
                rate(http_server_requests_seconds_bucket{namespace=~"petclinic-.*"}[5m])
              ) > 0.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High p95 latency on {{ $labels.job }}"
              description: "p95 latency on {{ $labels.job }} is {{ $value | humanizeDuration }} (threshold: 500ms)."
          - alert: HighMemoryUsage
            expr: |
              container_memory_working_set_bytes{namespace=~"petclinic-.*", container!=""}
              /
              container_spec_memory_limit_bytes{namespace=~"petclinic-.*", container!=""}
              > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage in {{ $labels.pod }}"
              description: "Container {{ $labels.container }} in {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit."

grafana:
  persistence:
    enabled: true
    storageClassName: gp2
    size: 5Gi
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: petclinic
          folder: Petclinic
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/petclinic
  dashboardsConfigMaps:
    petclinic: petclinic-dashboards
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s/"
    auth.anonymous:
      enabled: false

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

prometheusOperator:
  enabled: true
