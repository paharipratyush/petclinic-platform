# Helm values for grafana/loki
# Single-binary (monolithic) mode — suitable for dev/learning environment.
#
# Placeholders substituted by scripts/install-observability.sh:
#   LOKI_STORAGE_SIZE  — e.g., 10Gi (dev) or 50Gi (prod)
#   LOKI_RETENTION     — e.g., 168h (7 days, dev) or 720h (30 days, prod)

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: LOKI_RETENTION
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 6
    max_query_series: 5000
  compactor:
    retention_enabled: true
    working_directory: /var/loki/compactor
  rulerConfig:
    storage:
      type: local
      local:
        directory: /var/loki/rules
    rule_path: /var/loki/rules-temp
    alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
    enable_api: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClassName: gp2
    size: LOKI_STORAGE_SIZE

# Disable distributed components (using single binary mode)
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false

# Loki alerting rules for log-based alerts routed through Alertmanager
extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: loki-alert-rules
      namespace: monitoring
    data:
      petclinic-log-alerts.yaml: |
        groups:
          - name: petclinic.logs
            rules:
              - alert: LogErrorSpike
                expr: |
                  rate({namespace=~"petclinic-.*"} |= "ERROR" [5m]) > 0.5
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Log error spike in {{ $labels.namespace }}"
                  description: "Error log rate in {{ $labels.namespace }} exceeds 0.5/s for 5 minutes."
              - alert: JVMOutOfMemory
                expr: |
                  count_over_time({namespace=~"petclinic-.*"} |= "OutOfMemoryError" [5m]) > 0
                for: 0m
                labels:
                  severity: critical
                annotations:
                  summary: "JVM OutOfMemoryError in {{ $labels.namespace }}"
                  description: "An OutOfMemoryError was detected in {{ $labels.pod }} ({{ $labels.namespace }})."
