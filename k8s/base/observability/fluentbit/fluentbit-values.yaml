# Helm values for fluent/fluent-bit
# DaemonSet deployed on every node — collects container logs and forwards to Loki.
# No IRSA role required: Loki runs in-cluster, no AWS API calls needed.

kind: DaemonSet

rbac:
  create: true
  eventsAccess: false

serviceAccount:
  create: true
  name: fluent-bit

config:
  service: |
    [SERVICE]
        Daemon        Off
        Flush         1
        Log_Level     info
        Parsers_File  /fluent-bit/etc/parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On

  inputs: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        multiline.parser  docker, cri
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10
        Ignore_Older      1h

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off
        Annotations         Off
        Labels              On

    [FILTER]
        Name   grep
        Match  kube.*
        Regex  $kubernetes['namespace_name'] petclinic-.*|monitoring|tracing|argocd|external-secrets|kube-system

  outputs: |
    [OUTPUT]
        Name              loki
        Match             kube.*
        Host              loki.monitoring.svc.cluster.local
        Port              3100
        Labels            job=fluentbit
        Auto_Kubernetes_Labels  on
        Line_Format       json
        Retry_Limit       5

resources:
  requests:
    cpu: "50m"
    memory: "50Mi"
  limits:
    cpu: "200m"
    memory: "200Mi"

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

podAnnotations:
  fluentbit.io/exclude: "true"

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /api/v1/health
    port: http
