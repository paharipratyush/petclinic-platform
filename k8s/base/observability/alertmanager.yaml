---
# Alertmanager config — SMTP credentials are placeholders in Git.
# The install-observability.sh script patches this secret at deploy time
# by reading real values from AWS Secrets Manager (petclinic/alertmanager-smtp).
#
# To configure manually:
#   1. Store credentials in Secrets Manager:
#        aws secretsmanager create-secret \
#          --name petclinic/alertmanager-smtp \
#          --secret-string '{"email":"you@gmail.com","password":"xxxx xxxx xxxx xxxx"}'
#   2. Run the install script — it auto-loads and patches:
#        bash scripts/install-observability.sh --env dev
#   3. Or patch directly:
#        SMTP_EMAIL=you@gmail.com SMTP_PASSWORD="xxxx xxxx xxxx xxxx" \
#          bash scripts/install-observability.sh --env dev
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  alertmanager.yml: |
    global:
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: REPLACE_WITH_ALERT_EMAIL
      smtp_auth_username: REPLACE_WITH_ALERT_EMAIL
      smtp_auth_password: REPLACE_WITH_SMTP_PASSWORD
      smtp_require_tls: true

    route:
      receiver: email-default
      group_by: [alertname, namespace, severity]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - severity=critical
          receiver: email-critical
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1h

    receivers:
      - name: email-default
        email_configs:
          - to: REPLACE_WITH_ALERT_EMAIL
            send_resolved: true

      - name: email-critical
        email_configs:
          - to: REPLACE_WITH_ALERT_EMAIL
            send_resolved: true

    inhibit_rules:
      - source_matchers:
          - severity=critical
        target_matchers:
          - severity=warning
        equal: [alertname, namespace]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp2
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: petclinic
        app.kubernetes.io/component: infrastructure
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.external-url=http://alertmanager:9093
          ports:
            - name: http
              containerPort: 9093
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: data
              mountPath: /alertmanager
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 60
            periodSeconds: 15
      volumes:
        - name: config
          secret:
            secretName: alertmanager-config
        - name: data
          persistentVolumeClaim:
            claimName: alertmanager-data
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
      protocol: TCP
