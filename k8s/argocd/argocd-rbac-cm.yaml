apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  # Unauthenticated users get no access — deny-by-default
  policy.default: ""

  policy.csv: |
    # admin: full control over all applications, clusters, repos, projects
    p, role:admin, applications, *, */*, allow
    p, role:admin, clusters, get, *, allow
    p, role:admin, repositories, *, *, allow
    p, role:admin, projects, *, *, allow
    p, role:admin, accounts, *, *, allow
    p, role:admin, gpgkeys, *, *, allow
    p, role:admin, logs, get, */*, allow
    p, role:admin, exec, create, dev/*, allow
    p, role:admin, exec, create, prod/*, allow

    # developer: view all; sync, action, and delete only in dev environment
    p, role:developer, applications, get, */*, allow
    p, role:developer, applications, sync, dev/config-server-dev, allow
    p, role:developer, applications, sync, dev/discovery-server-dev, allow
    p, role:developer, applications, sync, dev/api-gateway-dev, allow
    p, role:developer, applications, sync, dev/customers-service-dev, allow
    p, role:developer, applications, sync, dev/visits-service-dev, allow
    p, role:developer, applications, sync, dev/vets-service-dev, allow
    p, role:developer, applications, sync, dev/genai-service-dev, allow
    p, role:developer, applications, sync, dev/admin-server-dev, allow
    p, role:developer, logs, get, */*, allow

    # Group mappings (add users/groups here as SSO is configured)
    g, petclinic-admin, role:admin
    g, petclinic-developer, role:developer
