# Prod environment overrides â€” merged last, always wins over per-service values
# Target namespace: petclinic-prod
# HPA, PDB, and replica counts are per-service in helm-values/{service}.yaml â€” they encode
# prod-appropriate defaults. dev.yaml overrides: replicaCount=1, autoscaling/PDB disabled.

# Constrained to 1 replica — 4x t4g.small nodes (11 pods/node = 44 total) leave only 8 slots for
# petclinic-prod after system/argocd/monitoring overhead. Increase replicas when vCPU quota allows more nodes.
replicaCount: 1

image:
  registry: "YOUR_ACCOUNT_ID.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod"

# Prod datasource URLs for MySQL services are in per-service prod override files:
#   helm-values/customers-service-prod.yaml
#   helm-values/visits-service-prod.yaml
#   helm-values/vets-service-prod.yaml
# Update PENDING_PROD_RDS_ENDPOINT in each after: terraform -chdir=terraform/environments/prod output rds_endpoint
# Do NOT set SPRING_DATASOURCE_URL here globally — it breaks non-MySQL services (e.g., genai-service).
config:
  # Send traces to Zipkin (installed by scripts/install-observability.sh â€” PETPLAT-60)
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://zipkin.tracing:9411/api/v2/spans"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
