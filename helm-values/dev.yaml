# Dev environment overrides — merged last, always wins over per-service values
# Target namespace: petclinic-dev
# image.registry is empty — per-service image.name holds the full Docker Hub path
# (springcommunity/spring-petclinic-{service}) until CI/CD pushes to ECR (PETPLAT-85).
# When ECR images exist: set registry to ECR path; revert image.name to short service names.
image:
  registry: ""

replicaCount: 1

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

# RDS datasource URL for MySQL-backed services (customers, visits, vets).
# Non-MySQL services ignore this key — it lands in their ConfigMap but Spring never reads it.
config:
  SPRING_DATASOURCE_URL: "jdbc:mysql://petclinic-dev-mysql.c1qcu40i4ohf.eu-central-1.rds.amazonaws.com:3306/petclinic"
