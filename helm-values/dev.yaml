# ─────────────────────────────────────────────────────────────────────────────
# helm-values/dev.yaml — Dev environment overrides
# ─────────────────────────────────────────────────────────────────────────────
# Values Hierarchy (ArgoCD merges in this order; later wins):
#   1. helm/petclinic-service/values.yaml  — chart defaults
#   2. helm-values/{service}.yaml          — per-service config (ports, env vars, init containers)
#   3. helm-values/dev.yaml                — THIS FILE: dev-specific overrides (replicas, HPA, registry)
#
# ArgoCD Application CRD specifies both value sources; you never run helm manually in prod.
# To test locally: helm template petclinic helm/petclinic-service/ -f helm-values/api-gateway.yaml -f helm-values/dev.yaml
# Target namespace: petclinic-dev
image:
  registry: "568521409121.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev"

replicaCount: 1

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

config:
  # Send traces to Zipkin (installed by scripts/install-observability.sh — PETPLAT-60)
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://zipkin.tracing:9411/api/v2/spans"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
