# Dev environment overrides — merged last, always wins over per-service values
# Target namespace: petclinic-dev
image:
  registry: "568521409121.dkr.ecr.eu-central-1.amazonaws.com"

replicaCount: 1

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

config:
  # Send traces to Zipkin (installed by scripts/install-observability.sh — PETPLAT-60)
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://zipkin.tracing:9411/api/v2/spans"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
