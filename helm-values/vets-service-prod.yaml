# Prod-only overrides for vets-service.
# Loaded as the third values file in k8s/argocd/applications/prod/vets-service.yaml,
# after vets-service.yaml + prod.yaml, so it wins on any key it sets.
#
# ACTION REQUIRED: after running `terraform apply` in terraform/environments/prod/,
# up.sh auto-replaces PENDING_PROD_RDS_ENDPOINT with the actual RDS hostname; or run manually:
#   terraform -chdir=terraform/environments/prod output rds_endpoint
config:
  SPRING_DATASOURCE_URL: "jdbc:mysql://PENDING_PROD_RDS_ENDPOINT:3306/petclinic"
