# Prod-only overrides for customers-service.
# Loaded as the third values file in k8s/argocd/applications/prod/customers-service.yaml,
# after customers-service.yaml + prod.yaml, so it wins on any key it sets.
#
# ACTION REQUIRED: after running `terraform apply` in terraform/environments/prod/,
# replace PENDING_PROD_RDS_ENDPOINT with the actual RDS hostname:
#   terraform -chdir=terraform/environments/prod output rds_endpoint
config:
  SPRING_DATASOURCE_URL: "jdbc:mysql://PENDING_PROD_RDS_ENDPOINT:3306/petclinic"
