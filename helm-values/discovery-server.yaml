image:
  name: discovery-server
  tag: "793ac56"
component: server
service:
  port: 8761
# prod default; dev.yaml overrides to 1
replicaCount: 2
# discovery-server never gets HPA (Eureka registry)
autoscaling:
  enabled: false
podDisruptionBudget:
  enabled: true
  minAvailable: 1
config:
  SPRING_PROFILES_ACTIVE: "docker"
  CONFIG_SERVER_URL: "http://config-server:8888"
initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - "until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done"
secrets: []
