# ─────────────────────────────────────────────────────────────────────────────
# helm-values/api-gateway.yaml — Per-service values for api-gateway
# ─────────────────────────────────────────────────────────────────────────────
# These are the prod-sensible defaults (2 replicas, HPA, PDB).
# helm-values/dev.yaml overrides replicaCount → 1 and disables HPA/PDB for dev.
# The full image ref rendered by Helm is:
#   {image.registry from dev.yaml or prod.yaml}/{image.name}:{image.tag}
# image.tag is updated automatically by .github/workflows/update-image-tags.yml on each CI push.
image:
  name: api-gateway
  tag: "64d78dd"
component: gateway
service:
  port: 8080
# prod default; dev.yaml overrides to 1
replicaCount: 2
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
# api-gateway needs more CPU headroom (handles all inbound routing)
resources:
  requests:
    cpu: "200m"
    memory: "128Mi"
  limits:
    cpu: "1000m"
    memory: "512Mi"
config:
  SPRING_PROFILES_ACTIVE: "docker"
  CONFIG_SERVER_URL: "http://config-server:8888"
  DISCOVERY_SERVER_URL: "http://discovery-server:8761/eureka"
initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - "until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done"
  - name: wait-for-discovery-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - "until wget -qO- http://discovery-server:8761/actuator/health; do sleep 5; done"
secrets: []
