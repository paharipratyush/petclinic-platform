name: Update Image Tags

on:
  repository_dispatch:
    types: [app-image-built]

permissions:
  contents: write

jobs:
  update-tags:
    name: Update helm-values image tags
    runs-on: ubuntu-latest

    steps:
      - name: Checkout platform repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image.tag in helm-values
        env:
          SHA: ${{ github.event.client_payload.sha }}
          SERVICES: ${{ github.event.client_payload.services }}
        run: |
          for service in ${SERVICES}; do
            if [ -f "helm-values/${service}.yaml" ]; then
              yq -i ".image.tag = \"${SHA}\"" "helm-values/${service}.yaml"
              echo "Updated helm-values/${service}.yaml → image.tag=${SHA}"
            else
              echo "WARNING: helm-values/${service}.yaml not found, skipping"
            fi
          done

      - name: Commit and push updated values
        env:
          SHA: ${{ github.event.client_payload.sha }}
          SERVICES: ${{ github.event.client_payload.services }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm-values/
          if git diff --staged --quiet; then
            echo "No helm-values changes to commit (tags already up to date)"
          else
            git commit -m "ci: update image tags to ${SHA} (${SERVICES})"
            git push
          fi
