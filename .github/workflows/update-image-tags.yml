name: Update Image Tags

on:
  repository_dispatch:
    types: [app-image-built]

permissions:
  contents: read

concurrency:
  group: update-image-tags
  cancel-in-progress: false

jobs:
  validate:
    name: Validate payload
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      services: ${{ steps.validate.outputs.services }}
    steps:
      - name: Validate and sanitize payload inputs
        id: validate
        env:
          SHA: ${{ github.event.client_payload.sha }}
          SERVICES: ${{ github.event.client_payload.services }}
        run: |
          set -euo pipefail
          # Reject if SHA is not a valid hex string (7-40 chars) — prevents shell injection
          if ! [[ "${SHA}" =~ ^[a-f0-9]{7,40}$ ]]; then
            echo "ERROR: invalid SHA format '${SHA}'" >&2
            exit 1
          fi
          # Reject if SERVICES contains anything other than lowercase alphanumeric, hyphens, underscores, spaces
          if ! [[ "${SERVICES}" =~ ^[a-z0-9_-]+([[:space:]][a-z0-9_-]+)*$ ]]; then
            echo "ERROR: invalid SERVICES format '${SERVICES}'" >&2
            exit 1
          fi
          echo "Payload validated: SHA=${SHA}, SERVICES=${SERVICES}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "services=${SERVICES}" >> "$GITHUB_OUTPUT"

  update-tags:
    name: Update helm-values and commit
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout platform repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          YQ_VER="v4.45.1"
          sudo wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VER}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          # Verify integrity: checksums file has filename first, then multiple hash columns.
          # Extract the SHA256 column (64-char lowercase hex) for yq_linux_amd64.
          wget -qO /tmp/yq_checksums \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VER}/checksums"
          ACTUAL=$(sha256sum /usr/local/bin/yq | awk '{print $1}')
          # checksums_hashes_order: field 1=filename, field 19=SHA-256 (18th hash in the order file)
          EXPECTED=$(awk '$1=="yq_linux_amd64" {print $19}' /tmp/yq_checksums)
          if [[ -z "${EXPECTED}" ]]; then
            echo "WARNING: could not extract SHA256 from checksums file — verification skipped"
          elif [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
            echo "ERROR: SHA256 mismatch! Got ${ACTUAL}, expected ${EXPECTED}" >&2; exit 1
          else
            echo "SHA256 verified: ${ACTUAL}"
          fi

      - name: Update image.tag in helm-values
        env:
          SHA: ${{ needs.validate.outputs.sha }}
          SERVICES: ${{ needs.validate.outputs.services }}
        run: |
          set -euo pipefail
          if [[ -z "${SERVICES}" ]]; then
            echo "No services in payload — skipping tag update"
            exit 0
          fi
          for service in ${SERVICES}; do
            if [ -f "helm-values/${service}.yaml" ]; then
              yq -i ".image.tag = \"${SHA}\"" "helm-values/${service}.yaml"
              echo "Updated helm-values/${service}.yaml → image.tag=${SHA}"
            else
              echo "WARNING: helm-values/${service}.yaml not found, skipping"
            fi
          done

      - name: Commit and push updated values
        env:
          SHA: ${{ needs.validate.outputs.sha }}
          SERVICES: ${{ needs.validate.outputs.services }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm-values/
          if git diff --staged --quiet; then
            echo "No helm-values changes to commit"
          else
            git commit -m "ci: update image tags to ${SHA} (${SERVICES})"
            git push
          fi
