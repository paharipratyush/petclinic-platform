# Reusable workflow: update image tags in helm-values and commit.
# Called by update-image-tags.yml to keep the dispatch handler thin.

name: Update Tags (Reusable)

on:
  workflow_call:
    inputs:
      sha:
        description: "7-character commit SHA used as image tag"
        required: true
        type: string
      services:
        description: "Space-separated list of service names to update"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    name: Update helm-values and commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image.tag in helm-values
        run: |
          for service in ${{ inputs.services }}; do
            if [ -f "helm-values/${service}.yaml" ]; then
              yq -i ".image.tag = \"${{ inputs.sha }}\"" "helm-values/${service}.yaml"
              echo "Updated helm-values/${service}.yaml → image.tag=${{ inputs.sha }}"
            else
              echo "WARNING: helm-values/${service}.yaml not found, skipping"
            fi
          done

      - name: Commit and push updated values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm-values/
          if git diff --staged --quiet; then
            echo "No helm-values changes to commit"
          else
            git commit -m "ci: update image tags to ${{ inputs.sha }} (${{ inputs.services }})"
            git push
          fi
